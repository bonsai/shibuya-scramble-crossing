<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shibuya Scramble — 写真アップロード</title>
  <style>
    :root {
      --bg: #0b0b0f;
      --card: #16161d;
      --text: #f2f2f5;
      --muted: #9a9aab;
      --accent: #ff4d6d;
      --border: #2a2a35;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      background: radial-gradient(1200px 600px at 20% -10%, #2a1020 0%, transparent 50%),
                  radial-gradient(800px 400px at 100% 0%, #1a2035 0%, transparent 45%),
                  var(--bg);
      color: var(--text);
      padding: 24px;
    }
    main { max-width: 720px; margin: 0 auto; }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin: 0 0 4px;
    }
    .sub { color: var(--muted); font-size: 0.95rem; margin-bottom: 28px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .drop {
      border: 2px dashed var(--border);
      border-radius: 12px;
      padding: 36px 20px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .drop:hover, .drop.dragover {
      border-color: var(--accent);
      background: rgba(255, 77, 109, 0.06);
    }
    .drop.busy { pointer-events: none; opacity: 0.7; }
    .drop p { margin: 8px 0 0; color: var(--muted); font-size: 0.9rem; }
    input[type="file"] { display: none; }
    #status {
      margin-top: 14px;
      font-size: 0.9rem;
      color: var(--muted);
      min-height: 1.2em;
    }
    #status.ok { color: #4ade80; }
    #status.err { color: #f87171; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 10px;
    }
    .thumb {
      aspect-ratio: 1;
      object-fit: cover;
      width: 100%;
      border-radius: 10px;
      background: #111;
      border: 1px solid var(--border);
    }
    .meta {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 4px;
      word-break: break-all;
    }
    h2 { font-size: 1.05rem; margin: 0 0 12px; }
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-bottom: 10px;
    }
    button {
      appearance: none;
      border: 1px solid var(--border);
      background: #1e1e28;
      color: var(--text);
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    button.primary {
      background: var(--accent);
      border-color: transparent;
      color: #fff;
    }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    #colabInfo, #colabLog {
      font-size: 0.85rem;
      color: var(--muted);
      white-space: pre-wrap;
      word-break: break-all;
    }
    #colabLog {
      max-height: 180px;
      overflow: auto;
      background: #0e0e14;
      border-radius: 8px;
      padding: 10px;
      margin-top: 8px;
      border: 1px solid var(--border);
    }
    label.chk {
      font-size: 0.85rem;
      color: var(--muted);
      display: inline-flex;
      gap: 6px;
      align-items: center;
    }
  </style>
</head>
<body>
  <main>
    <h1>渋谷スクランブル交差点</h1>
    <p class="sub">写真を選ぶだけで投稿（JPEG / PNG / WebP ・最大 15MB）</p>

    <section class="card">
      <div class="drop" id="drop">
        <strong>クリック or ドロップですぐ送信</strong>
        <p>複数枚 OK</p>
      </div>
      <input type="file" id="file" accept="image/jpeg,image/png,image/webp" multiple />
      <div id="status"></div>
    </section>

    <section class="card">
      <h2>Colab バッチ</h2>
      <div id="colabInfo">トンネル未登録</div>
      <div class="row" style="margin-top:12px">
        <button type="button" id="btnStatus">状態</button>
        <button type="button" class="primary" id="btnBatch">バッチ開始</button>
        <button type="button" id="btnDry">dry-run</button>
        <button type="button" id="btnStop">停止</button>
      </div>
      <div class="row">
        <label class="chk"><input type="checkbox" id="optForce" /> force</label>
      </div>
      <div id="colabLog"></div>
    </section>

    <section class="card">
      <h2>最近の投稿</h2>
      <div class="grid" id="list"></div>
    </section>
  </main>

  <script>
    const drop = document.getElementById("drop");
    const fileInput = document.getElementById("file");
    const statusEl = document.getElementById("status");
    const listEl = document.getElementById("list");
    const colabInfo = document.getElementById("colabInfo");
    const colabLog = document.getElementById("colabLog");

    function setStatus(msg, type = "") {
      statusEl.textContent = msg;
      statusEl.className = type;
    }

    async function uploadFiles(files) {
      const list = [...files].filter((f) => f.type.startsWith("image/"));
      if (!list.length) {
        setStatus("画像ファイルを選んでください", "err");
        return;
      }
      drop.classList.add("busy");
      let ok = 0, fail = 0;
      for (const file of list) {
        setStatus(`送信中… ${ok + fail + 1}/${list.length}`);
        const form = new FormData();
        form.append("file", file);
        try {
          const res = await fetch("/api/upload", { method: "POST", body: form });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || res.statusText);
          ok++;
        } catch (e) {
          fail++;
          console.error(e);
        }
      }
      setStatus(
        fail === 0 ? `${ok} 枚完了` : `${ok} 成功 / ${fail} 失敗`,
        fail === 0 ? "ok" : "err"
      );
      fileInput.value = "";
      drop.classList.remove("busy");
      loadList();
    }

    drop.addEventListener("click", () => {
      if (!drop.classList.contains("busy")) fileInput.click();
    });
    drop.addEventListener("dragover", (e) => {
      e.preventDefault();
      drop.classList.add("dragover");
    });
    drop.addEventListener("dragleave", () => drop.classList.remove("dragover"));
    drop.addEventListener("drop", (e) => {
      e.preventDefault();
      drop.classList.remove("dragover");
      if (e.dataTransfer.files?.length) uploadFiles(e.dataTransfer.files);
    });
    fileInput.addEventListener("change", () => {
      if (fileInput.files?.length) uploadFiles(fileInput.files);
    });

    async function loadList() {
      try {
        const res = await fetch("/api/photos?limit=24");
        const data = await res.json();
        listEl.innerHTML = "";
        if (!data.objects?.length) {
          listEl.innerHTML = "<p class=\"meta\">まだ写真がありません</p>";
          return;
        }
        for (const o of data.objects) {
          const wrap = document.createElement("div");
          const img = document.createElement("img");
          img.className = "thumb";
          img.loading = "lazy";
          img.src = o.url;
          img.alt = o.key;
          const meta = document.createElement("div");
          meta.className = "meta";
          meta.textContent = o.key.split("/").pop();
          wrap.append(img, meta);
          listEl.appendChild(wrap);
        }
      } catch {
        listEl.innerHTML = "<p class=\"meta\">一覧の取得に失敗しました</p>";
      }
    }

    async function loadColabInfo() {
      try {
        const res = await fetch("/api/colab");
        const data = await res.json();
        if (!data.registered) {
          colabInfo.textContent = "トンネル未登録 — Colab で tunnel_server.py を起動";
          return;
        }
        colabInfo.textContent = `registered ${data.registered_at || ""}\n${data.tunnel_url}`;
      } catch {
        colabInfo.textContent = "Colab 情報の取得に失敗";
      }
    }

    async function refreshColabStatus() {
      try {
        const res = await fetch("/api/colab/status");
        const data = await res.json();
        if (data.error) {
          colabLog.textContent = data.error + (data.detail ? "\n" + data.detail : "");
          return;
        }
        const lines = [
          `status: ${data.status || "?"}`,
          data.message || "",
          data.started_at ? `started: ${data.started_at}` : "",
          data.finished_at ? `finished: ${data.finished_at}` : "",
          "",
          ...(data.log_tail || []),
        ].filter(Boolean);
        colabLog.textContent = lines.join("\n");
      } catch (e) {
        colabLog.textContent = String(e);
      }
    }

    async function startBatch(extra = {}) {
      const body = {
        force: document.getElementById("optForce").checked,
        ...extra,
      };
      colabLog.textContent = "starting...";
      try {
        const res = await fetch("/api/colab/batch", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        const data = await res.json();
        colabLog.textContent = JSON.stringify(data, null, 2);
        setTimeout(refreshColabStatus, 1500);
      } catch (e) {
        colabLog.textContent = String(e);
      }
    }

    document.getElementById("btnStatus").onclick = () => {
      loadColabInfo();
      refreshColabStatus();
    };
    document.getElementById("btnBatch").onclick = () => startBatch();
    document.getElementById("btnDry").onclick = () => startBatch({ dry_run: true });
    document.getElementById("btnStop").onclick = async () => {
      const res = await fetch("/api/colab/stop", { method: "POST" });
      colabLog.textContent = await res.text();
      setTimeout(refreshColabStatus, 800);
    };

    loadList();
    loadColabInfo();
  </script>
</body>
</html>
