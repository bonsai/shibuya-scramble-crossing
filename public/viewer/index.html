<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shibuya Scramble — 3D 街ビューア</title>
  <style>
    :root {
      --bg: #0b0b0f;
      --card: rgba(22, 22, 29, 0.85);
      --text: #f2f2f5;
      --muted: #9a9aab;
      --accent: #ff4d6d;
      --border: #2a2a35;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--text);
    }
    #viewer-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .hud {
      position: absolute;
      top: 16px;
      left: 16px;
      background: var(--card);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      max-width: 320px;
      font-size: 0.85rem;
      pointer-events: auto;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }
    .hud select {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 2px 6px;
      font-size: 0.8rem;
      outline: none;
    }
    .hud h1 {
      font-size: 1rem;
      margin: 0 0 8px;
      font-weight: 700;
      color: var(--text);
    }
    .hud-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
      gap: 12px;
    }
    .hud-label {
      color: var(--muted);
      flex-shrink: 0;
    }
    .hud-val {
      color: var(--text);
      font-weight: 600;
      text-align: right;
      word-break: break-all;
    }
    .hud-status {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
      color: var(--accent);
      font-size: 0.8rem;
      line-height: 1.4;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.162.0/examples/jsm/",
        "@mkkellogg/gaussian-splats-3d": "https://cdn.jsdelivr.net/npm/@mkkellogg/gaussian-splats-3d@0.4.4/build/gaussian-splats-3d.module.js"
      }
    }
  </script>
</head>
<body>
  <canvas id="viewer-canvas"></canvas>

  <div class="hud">
    <h1>渋谷スクランブル交差点 3D</h1>
    <div class="hud-row">
      <span class="hud-label">ステージ選択:</span>
      <span class="hud-val">
        <select id="stage-select">
          <option value="auto">自動</option>
          <option value="city_gs">高品質 (3DGS)</option>
          <option value="city_glb">軽量 (GLB)</option>
        </select>
      </span>
    </div>
    <div class="hud-row">
      <span class="hud-label">判定種別 (Kind):</span>
      <span class="hud-val" id="hud-kind">ロード中…</span>
    </div>
    <div class="hud-row">
      <span class="hud-label">ソース (Source):</span>
      <span class="hud-val" id="hud-source">ロード中…</span>
    </div>
    <div class="hud-row">
      <span class="hud-label">アセット (Asset):</span>
      <span class="hud-val" id="hud-asset">-</span>
    </div>
    <div class="hud-status" id="hud-status">ステータス確認中…</div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
